<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="title desc"><title id="title">マンセル表色系の色票</title><desc id="desc">色彩検定2級の学習用に再構成した図版です。</desc><rect width="900" height="280" fill="#f7f5f0"/><g font-family="sans-serif" fill="#222"><rect x="50" y="80" width="110" height="110" rx="8" fill="#171717" stroke="#333"/><text x="105" y="220" text-anchor="middle" font-size="18">N1</text><rect x="185" y="80" width="110" height="110" rx="8" fill="#f4c400" stroke="#333"/><text x="240" y="220" text-anchor="middle" font-size="18">5Y</text><rect x="320" y="80" width="110" height="110" rx="8" fill="#829b3e" stroke="#333"/><text x="375" y="220" text-anchor="middle" font-size="18">同明度・彩度変化</text><rect x="455" y="80" width="110" height="110" rx="8" fill="#b83332" stroke="#333"/><text x="510" y="220" text-anchor="middle" font-size="18">R</text><rect x="590" y="80" width="110" height="110" rx="8" fill="#7a3e86" stroke="#333"/><text x="645" y="220" text-anchor="middle" font-size="18">P</text><rect x="725" y="80" width="110" height="110" rx="8" fill="#2f88a5" stroke="#333"/><text x="780" y="220" text-anchor="middle" font-size="18">PB</text><text x="450" y="35" text-anchor="middle" font-size="24">マンセル表色系：学習用近似色</text></g></svg>
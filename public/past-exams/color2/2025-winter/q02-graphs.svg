<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc"><title id="title">光と視覚の3つのグラフ</title><desc id="desc">色彩検定2級の学習用に再構成した図版です。</desc><rect width="900" height="300" fill="#f7f5f0"/><g font-family="sans-serif" fill="#222"><text x="50" y="35" font-size="22">分光分布</text><line x1="60" y1="220" x2="300" y2="220" stroke="#333" stroke-width="2"/><line x1="60" y1="60" x2="60" y2="220" stroke="#333" stroke-width="2"/><polyline points="60,160 90,95 120,78 150,82 180,100 210,112 240,125 270,116 300,145" fill="none" stroke="#444" stroke-width="5"/><text x="110" y="250" font-size="17">400〜700nm</text><text x="350" y="35" font-size="22">分光反射率</text><line x1="360" y1="220" x2="600" y2="220" stroke="#333" stroke-width="2"/><line x1="360" y1="60" x2="360" y2="220" stroke="#333" stroke-width="2"/><path d="M360 190 C395 170,420 85,455 80 C500 75,520 185,600 195" fill="none" stroke="#2f8f8b" stroke-width="6"/><text x="410" y="250" font-size="17">短波長域を多く反射</text><text x="650" y="35" font-size="22">分光視感効率</text><line x1="660" y1="220" x2="860" y2="220" stroke="#333" stroke-width="2"/><line x1="660" y1="60" x2="660" y2="220" stroke="#333" stroke-width="2"/><path d="M660 215 C690 205,720 90,755 65 C790 90,815 190,860 215" fill="none" stroke="#333" stroke-width="5"/><path d="M660 215 C690 185,710 85,735 55 C760 90,785 200,860 215" fill="none" stroke="#777" stroke-width="5" stroke-dasharray="8 7"/><text x="700" y="250" font-size="17">実線：明所視 / 点線：暗所視</text></g></svg>
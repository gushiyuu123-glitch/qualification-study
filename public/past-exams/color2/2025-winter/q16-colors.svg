<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">慣用色名の近似色</title><desc id="desc">色彩検定2級の学習用に再構成した図版です。</desc><rect width="900" height="460" fill="#f7f5f0"/><g font-family="sans-serif" fill="#222"><text x="450" y="38" text-anchor="middle" font-size="24">慣用色名：学習用近似色</text><rect x="45" y="70" width="160" height="110" rx="6" fill="#a12620" stroke="#333"/><text x="125" y="210" text-anchor="middle" font-size="20">韓紅花</text><rect x="330" y="70" width="160" height="110" rx="6" fill="#2d3a20" stroke="#333"/><text x="410" y="210" text-anchor="middle" font-size="20">海松色</text><rect x="615" y="70" width="160" height="110" rx="6" fill="#3a223d" stroke="#333"/><text x="695" y="210" text-anchor="middle" font-size="20">古代紫</text><rect x="45" y="260" width="160" height="110" rx="6" fill="#35151d" stroke="#333"/><text x="125" y="400" text-anchor="middle" font-size="20">バーガンディー</text><rect x="330" y="260" width="160" height="110" rx="6" fill="#c58b2c" stroke="#333"/><text x="410" y="400" text-anchor="middle" font-size="20">ネープルスイエロー</text><rect x="615" y="260" width="160" height="110" rx="6" fill="#1f6f6e" stroke="#333"/><text x="695" y="400" text-anchor="middle" font-size="20">ナイルブルー</text></g></svg>
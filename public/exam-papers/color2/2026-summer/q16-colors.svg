<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="慣用色名の学習用近似色票"><rect width="1000" height="520" fill="#f7f5ef"/><g font-family="sans-serif" fill="#222"><text x="500" y="40" text-anchor="middle" font-size="28" font-weight="700">慣用色名：学習用近似色</text><g transform="translate(65 105)" font-size="17"><g><rect width="120" height="120" fill="#d5a62b"/><text x="60" y="150" text-anchor="middle">鬱金色</text></g><g transform="translate(150)"><rect width="120" height="120" fill="#2b8062"/><text x="60" y="150" text-anchor="middle">常磐色</text></g><g transform="translate(300)"><rect width="120" height="120" fill="#a49a82"/><text x="60" y="150" text-anchor="middle">茶鼠</text></g><g transform="translate(450)"><rect width="120" height="120" fill="#d98e99"/><text x="60" y="150" text-anchor="middle">ローズピンク</text></g><g transform="translate(600)"><rect width="120" height="120" fill="#e3c43e"/><text x="60" y="150" text-anchor="middle">ジョンブリアン</text></g><g transform="translate(750)"><rect width="120" height="120" fill="#277b9e"/><text x="60" y="150" text-anchor="middle">セルリアンブルー</text></g></g><g transform="translate(160 350)"><rect width="680" height="86" rx="14" fill="#eee9dc" stroke="#b8ad97"/><text x="340" y="34" text-anchor="middle" font-size="18">画面色は学習用の近似色</text><text x="340" y="62" text-anchor="middle" font-size="16">色相・明度・彩度と名称の由来を合わせて判断</text></g></g></svg>
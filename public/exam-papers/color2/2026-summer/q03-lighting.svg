<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="照明と演色性を再構成した学習用図版"><rect width="1000" height="520" fill="#f7f5ef"/><g font-family="sans-serif" fill="#222"><text x="500" y="40" text-anchor="middle" font-size="28" font-weight="700">照明と色の見え</text><g transform="translate(70 90)"><text x="180" text-anchor="middle" font-size="19">同じ色票・異なる光源</text><rect y="30" width="360" height="150" rx="12" fill="#fff" stroke="#777"/><g transform="translate(30 60)"><rect width="55" height="42" fill="#e29572"/><rect x="62" width="55" height="42" fill="#a88cbc"/><rect x="124" width="55" height="42" fill="#87b68e"/><rect x="186" width="55" height="42" fill="#d09aaf"/><rect x="248" width="55" height="42" fill="#7cc1bb"/><rect y="50" width="55" height="42" fill="#ad744a"/><rect x="62" y="50" width="55" height="42" fill="#73677e"/><rect x="124" y="50" width="55" height="42" fill="#856b62"/><rect x="186" y="50" width="55" height="42" fill="#948d55"/><rect x="248" y="50" width="55" height="42" fill="#925365"/></g></g><g transform="translate(500 90)"><text x="200" text-anchor="middle" font-size="19">分光分布の違い</text><path d="M0 180H400M0 30V180" stroke="#333" fill="none"/><path d="M0 170C60 150 95 75 155 70S280 35 400 160" stroke="#555" stroke-width="5" fill="none"/><path d="M0 170L45 170L60 35L75 170L125 170L145 70L160 170L220 170L240 55L255 170L330 170L350 105L365 170L400 170" stroke="#888" stroke-width="4" fill="none"/></g><g transform="translate(220 350)"><rect width="560" height="100" rx="15" fill="#eee9dc" stroke="#b8ad97"/><text x="280" y="36" text-anchor="middle" font-size="18">低い色温度　暖かい光色　←→　高い色温度　青みの光色</text><text x="280" y="70" text-anchor="middle" font-size="16">演色性は物体色の見え方に影響する</text></g></g></svg>
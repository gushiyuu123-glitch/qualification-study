<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="多色配色技法を再構成した学習用図版"><rect width="1000" height="520" fill="#f7f5ef"/><g font-family="sans-serif" fill="#222"><text x="500" y="40" text-anchor="middle" font-size="28" font-weight="700">多色配色とイメージ</text><g transform="translate(50 95)"><text x="105" text-anchor="middle" font-size="18">トライアド</text><rect y="30" width="70" height="115" fill="#245d8b"/><rect x="70" y="30" width="70" height="115" fill="#d39b38"/><rect x="140" y="30" width="70" height="115" fill="#784b8d"/></g><g transform="translate(285 95)"><text x="105" text-anchor="middle" font-size="18">トリコロール</text><rect y="30" width="70" height="115" fill="#2f4480"/><rect x="70" y="30" width="70" height="115" fill="#89b42a"/><rect x="140" y="30" width="70" height="115" fill="#c84946"/></g><g transform="translate(520 95)"><text x="105" text-anchor="middle" font-size="18">カマイユ</text><rect y="30" width="70" height="115" fill="#7e4f91"/><rect x="70" y="30" width="70" height="115" fill="#8d5f9c"/><rect x="140" y="30" width="70" height="115" fill="#9b6eaa"/></g><g transform="translate(755 95)"><text x="90" text-anchor="middle" font-size="18">テトラード</text><rect y="30" width="45" height="115" fill="#d5bd25"/><rect x="45" y="30" width="45" height="115" fill="#2f8b66"/><rect x="90" y="30" width="45" height="115" fill="#75569b"/><rect x="135" y="30" width="45" height="115" fill="#b95b3a"/></g><g transform="translate(140 350)"><rect width="720" height="90" rx="15" fill="#eee9dc" stroke="#b8ad97"/><text x="360" y="36" text-anchor="middle" font-size="18">色数と色相差を数えて技法を判定</text><text x="360" y="66" text-anchor="middle" font-size="16">クラシックは低〜中明度・低彩度、モダンは無彩色を活用</text></g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="サインと色空間を再構成した学習用図版"><rect width="1000" height="520" fill="#f7f5ef"/><g font-family="sans-serif" fill="#222"><text x="500" y="40" text-anchor="middle" font-size="28" font-weight="700">サインとデジタル色</text><g transform="translate(90 90)"><text x="145" text-anchor="middle" font-size="19">視認性の高いサイン</text><rect x="35" y="35" width="220" height="180" rx="24" fill="#b9252c"/><text x="145" y="100" text-anchor="middle" font-size="52" font-weight="800" fill="#fff">SOS</text><circle cx="145" cy="155" r="30" fill="#fff"/><path d="M145 140V195M125 170H165" stroke="#b9252c" stroke-width="9"/></g><g transform="translate(440 85)"><text x="225" text-anchor="middle" font-size="19">RGB と CMYK</text><g transform="translate(10 45)" style="mix-blend-mode:multiply"><circle cx="75" cy="75" r="60" fill="#ff4b55" opacity=".72"/><circle cx="130" cy="75" r="60" fill="#4dc96b" opacity=".72"/><circle cx="102" cy="125" r="60" fill="#4c76ff" opacity=".72"/></g><text x="110" y="245" text-anchor="middle" font-size="16">光：RGB</text><g transform="translate(270 45)" style="mix-blend-mode:multiply"><circle cx="75" cy="75" r="60" fill="#00bcd4" opacity=".72"/><circle cx="130" cy="75" r="60" fill="#e84a9b" opacity=".72"/><circle cx="102" cy="125" r="60" fill="#f5d328" opacity=".72"/></g><text x="370" y="245" text-anchor="middle" font-size="16">印刷：CMYK</text></g><g transform="translate(210 375)"><rect width="580" height="78" rx="14" fill="#eee9dc" stroke="#b8ad97"/><text x="290" y="32" text-anchor="middle" font-size="17">RGBの高彩度色はCMYKで再現しにくい場合がある</text><text x="290" y="59" text-anchor="middle" font-size="15">カラープロファイルで変換時の色ずれを抑える</text></g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="2025年度冬期 問題7の図1と配色選択図">
  <rect width="1200" height="900" fill="#f7f5ef"/>
  <g font-family="sans-serif" fill="#222">
    <text x="60" y="48" font-size="22" font-weight="700">図1</text>
    <rect x="60" y="70" width="135" height="135" fill="#68306f"/>

    <text x="260" y="48" font-size="22" font-weight="700">A</text>
    <g transform="translate(260 75)" font-size="18" text-anchor="middle">
      <text x="105" y="-8">①</text>
      <rect x="0" y="0" width="70" height="110" fill="#c4d28e"/><rect x="70" y="0" width="70" height="110" fill="#aacd97"/><rect x="140" y="0" width="70" height="110" fill="#91c7af"/>
      <text x="355" y="-8">②</text>
      <rect x="250" y="0" width="70" height="110" fill="#9eba03"/><rect x="320" y="0" width="70" height="110" fill="#bfcd5e"/><rect x="390" y="0" width="70" height="110" fill="#779911"/>
      <text x="605" y="-8">③</text>
      <rect x="500" y="0" width="70" height="110" fill="#d78112"/><rect x="570" y="0" width="70" height="110" fill="#2b9780"/><rect x="640" y="0" width="70" height="110" fill="#602c6e"/>
      <text x="855" y="-8">④</text>
      <rect x="750" y="0" width="70" height="110" fill="#edc703"/><rect x="820" y="0" width="70" height="110" fill="#bf2531"/><rect x="890" y="0" width="70" height="110" fill="#1f1f1f"/>
    </g>

    <text x="60" y="310" font-size="22" font-weight="700">D</text>
    <g transform="translate(60 340)" font-size="18" text-anchor="middle">
      <text x="80" y="-8">①</text><rect x="0" y="0" width="160" height="135" fill="#4e3016"/>
      <text x="340" y="-8">②</text><rect x="260" y="0" width="160" height="135" fill="#79a005"/>
      <text x="600" y="-8">③</text><rect x="520" y="0" width="160" height="135" fill="#094964"/>
      <text x="860" y="-8">④</text><rect x="780" y="0" width="160" height="135" fill="#aa7aae"/>
    </g>

    <text x="60" y="585" font-size="22" font-weight="700">G</text>
    <g transform="translate(60 620)" font-size="18" text-anchor="middle">
      <text x="110" y="-8">①</text><rect x="0" y="0" width="110" height="145" fill="#edc605"/><rect x="110" y="0" width="110" height="145" fill="#a7a9b5"/>
      <text x="390" y="-8">②</text><rect x="280" y="0" width="110" height="145" fill="#799d05"/><rect x="390" y="0" width="110" height="145" fill="#9da864"/>
      <text x="670" y="-8">③</text><rect x="560" y="0" width="110" height="145" fill="#0157a0"/><rect x="670" y="0" width="110" height="145" fill="#1c4b9b"/>
      <text x="950" y="-8">④</text><rect x="840" y="0" width="110" height="145" fill="#127c31"/><rect x="950" y="0" width="110" height="145" fill="#6463aa"/>
    </g>

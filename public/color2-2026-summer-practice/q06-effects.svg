<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="色の錯視を再構成した学習用図版"><rect width="1000" height="520" fill="#f7f5ef"/><g font-family="sans-serif" fill="#222"><text x="500" y="40" text-anchor="middle" font-size="28" font-weight="700">色の見えの効果</text><g transform="translate(50 80)"><text x="140" text-anchor="middle" font-size="19">リープマン効果</text><rect x="15" y="35" width="250" height="145" fill="#087d45"/><text x="140" y="150" text-anchor="middle" font-size="112" font-weight="800" fill="#d62f43">R</text></g><g transform="translate(360 80)"><text x="140" text-anchor="middle" font-size="19">透明視</text><rect x="20" y="45" width="165" height="85" fill="#ead214"/><rect x="105" y="90" width="165" height="85" fill="#4e58a5"/><rect x="105" y="90" width="80" height="40" fill="#fff" opacity=".7"/></g><g transform="translate(665 80)"><text x="140" text-anchor="middle" font-size="19">方向に依存する残効</text><rect x="5" y="35" width="125" height="125" fill="#111"/><g stroke="#178b4b" stroke-width="9"><path d="M15 50H120M15 75H120M15 100H120M15 125H120M15 150H120"/></g><rect x="150" y="35" width="125" height="125" fill="#111"/><g stroke="#d13942" stroke-width="9"><path d="M165 45V150M190 45V150M215 45V150M240 45V150M265 45V150"/></g></g><g transform="translate(280 350)"><rect width="440" height="90" rx="15" fill="#eee9dc" stroke="#b8ad97"/><text x="220" y="35" text-anchor="middle" font-size="18">境界のちらつきは明度差を確保して抑える</text><text x="220" y="65" text-anchor="middle" font-size="16">透明視とマッカロー効果を図で区別</text></g></g></svg>